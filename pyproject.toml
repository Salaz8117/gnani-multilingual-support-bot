[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnani-multilingual-support-bot"
version = "0.1.0"
description = "Multilingual Voice Customer Support Bot using Gnani AI APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "tenacity==8.2.3",
    "pydub==0.25.1",
    "librosa==0.10.2",
    "soundfile==0.12.1",
    "numpy==1.26.4",
    "gradio==4.44.0",
    "structlog==24.1.0",
    "rich==13.7.1",
    "twilio==9.0.0",
    "redis==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "black==24.4.2",
    "ruff==0.4.3",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP006", "UP007"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true