[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnani-multilingual-support-bot"
version = "0.1.0"
description = "Multilingual Voice Customer Support Bot using Gnani AI APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "httpx>=0.28.0,<1.0",
    "tenacity>=8.5.0,<10.0",
    "pydub>=0.25.1,<1.0",
    "librosa>=0.11.0,<1.0",
    "soundfile>=0.13.0,<1.0",
    "numpy>=2.1.0,<3.0",
    "gradio>=5.0.0,<6.0",
    "structlog>=24.1.0,<26.0",
    "rich>=13.7.1,<15.0",
    "twilio>=9.0.0,<10.0",
    "redis>=5.2.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0",
    "pytest-asyncio>=0.24.0,<2.0",
    "pytest-cov>=5.0.0,<7.0",
    "black>=24.10.0,<27.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "pre-commit>=3.8.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP006", "UP007"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true